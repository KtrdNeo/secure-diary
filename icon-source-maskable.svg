<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="45%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#3f2414"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d5c30"/>
      <stop offset="35%" stop-color="#e2c690"/>
      <stop offset="58%" stop-color="#b8935a"/>
      <stop offset="100%" stop-color="#7d5c30"/>
    </linearGradient>
  </defs>

  <!-- Leather fills the full canvas edge-to-edge - required for maskable
       icons, since launchers crop this to their own shape (circle,
       squircle, rounded square) and any un-filled edge would show as a
       hard-edged mismatch against the launcher's background. -->
  <rect width="512" height="512" fill="url(#leather)"/>

  <!-- Book motif compressed into the ~80% "safe zone" (avoids the outer
       ~10% margin on every side that a circular crop would cut into). -->
  <rect x="204" y="128" width="220" height="272" rx="10" fill="#efe2c0"/>
  <rect x="204" y="128" width="220" height="272" rx="10" fill="none" stroke="#00000018" stroke-width="3"/>

  <g>
    <ellipse cx="168" cy="192" rx="26" ry="19" fill="none" stroke="url(#ring)" stroke-width="12"/>
    <ellipse cx="168" cy="264" rx="26" ry="19" fill="none" stroke="url(#ring)" stroke-width="12"/>
    <ellipse cx="168" cy="336" rx="26" ry="19" fill="none" stroke="url(#ring)" stroke-width="12"/>
  </g>
</svg>
