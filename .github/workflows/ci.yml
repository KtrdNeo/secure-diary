name: CI

# Runs on every push and pull request - catches a broken test or a
# broken build before it ever reaches Vercel, independent of whichever
# deployment method is used (dashboard auto-deploy or deploy.yml below).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
