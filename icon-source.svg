<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="45%" stop-color="#6b4226"/>
      <stop offset="100%" stop-color="#3f2414"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d5c30"/>
      <stop offset="35%" stop-color="#e2c690"/>
      <stop offset="58%" stop-color="#b8935a"/>
      <stop offset="100%" stop-color="#7d5c30"/>
    </linearGradient>
  </defs>

  <!-- Safe-area background fill (maskable icons get cropped to a circle by
       some launchers, so the leather color needs to reach every edge). -->
  <rect width="512" height="512" fill="#6b4226"/>

  <!-- Leather cover -->
  <rect x="0" y="0" width="512" height="512" rx="72" fill="url(#leather)"/>

  <!-- Paper page, inset to the right (matches the app's actual left-spine layout) -->
  <rect x="176" y="96" width="256" height="320" rx="10" fill="#efe2c0"/>
  <rect x="176" y="96" width="256" height="320" rx="10" fill="none" stroke="#00000018" stroke-width="3"/>

  <!-- Ring binder along the spine -->
  <g>
    <ellipse cx="128" cy="166" rx="30" ry="22" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <ellipse cx="128" cy="256" rx="30" ry="22" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <ellipse cx="128" cy="346" rx="30" ry="22" fill="none" stroke="url(#ring)" stroke-width="14"/>
  </g>
</svg>
